name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/validate.mjs
      - run: npm test
      - run: node scripts/mcp-manager.mjs list --json > /dev/null
      - run: node scripts/mcp-manager.mjs stack superapp --config /tmp/smoke-opencode.json && cat /tmp/smoke-opencode.json
