name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: node scripts/mcp-manager.mjs list --json > /dev/null
      - run: node scripts/mcp-manager.mjs stack superapp --config /tmp/smoke-opencode.json && cat /tmp/smoke-opencode.json
