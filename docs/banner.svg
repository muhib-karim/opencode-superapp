<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="OpenCode SuperApp — a curated MCP server registry and one-command installer for OpenCode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- motif: OpenCode hub connected to MCP server nodes -->
  <g transform="translate(1010 160)">
    <circle r="120" fill="url(#glow)"/>
    <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7" fill="none">
      <path d="M0 0L-150 -90M0 0L-40 -120M0 0L90 -100M0 0L160 -20M0 0L130 90M0 0L20 125M0 0L-110 100M0 0L-175 10"/>
    </g>
    <g fill="#0f172a" stroke="url(#accent)" stroke-width="2.5">
      <circle cx="-150" cy="-90" r="13"/><circle cx="-40" cy="-120" r="11"/><circle cx="90" cy="-100" r="14"/>
      <circle cx="160" cy="-20" r="11"/><circle cx="130" cy="90" r="13"/><circle cx="20" cy="125" r="11"/>
      <circle cx="-110" cy="100" r="14"/><circle cx="-175" cy="10" r="10"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="-150" cy="-90" r="4"/><circle cx="90" cy="-100" r="4"/><circle cx="130" cy="90" r="4"/><circle cx="-110" cy="100" r="4"/>
    </g>
    <rect x="-46" y="-34" width="92" height="68" rx="12" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <text x="0" y="9" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">&gt;_</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="138" fill="#f8fafc" font-size="64" font-weight="700">OpenCode <tspan fill="url(#accent)">SuperApp</tspan></text>
    <text x="82" y="190" fill="#cbd5e1" font-size="26">Curated MCP servers and one-command stacks for OpenCode</text>
    <rect x="82" y="222" width="560" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="100" y="248" fill="#7ee787" font-family="Consolas, Menlo, monospace" font-size="18">$ ./install.sh --superapp</text>
  </g>
</svg>
